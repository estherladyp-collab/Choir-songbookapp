<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>Victory Choir Songbook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="hero-top">
      <div class="slot-l"><button id="themeBtn" class="pill icon" type="button" aria-label="Appearance"></button></div>
      <img class="logo" src="assets/logo.png" alt="Victory Outreach Ministry International logo">
      <div class="slot-r"><button id="roleBtn" class="pill" type="button">Member</button></div>
    </div>
    <p class="eyebrow">Victory Outreach Ministry International</p>
    <h1>Choir <em>Songbook</em></h1>
    <div class="orn"><i></i></div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-in">
    <div class="tabs" role="tablist" aria-label="Section">
      <button class="tab" data-cover type="button">Home</button>
      <button class="tab on" data-tab="songs" type="button" role="tab">Songs</button>
      <button class="tab" data-tab="sets" type="button" role="tab">Set Lists</button>
    </div>
    <div class="tools" id="songTools">
      <div class="search"><input id="q" type="search" placeholder="Search title, composer or lyrics" autocomplete="off" aria-label="Search songs"></div>
      <div class="chips" id="cats" role="tablist" aria-label="Category"></div>
      <div class="leaderbar" id="leaderbar" hidden>
        <label for="leaderSel">Keys for</label>
        <select id="leaderSel"></select>
        <label class="check"><input type="checkbox" id="onlyKeys"> only songs with a key</label>
      </div>
    </div>
  </div>
</div>

<main>
  <div id="songsView">
    <div class="count" id="count"></div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden>No songs found. Try another word.</div>
  </div>
  <div id="setsView" hidden></div>
</main>

<button id="addBtn" class="fab" type="button" hidden aria-label="Add">+</button>

<section id="cover" class="cover" role="dialog" aria-modal="true" aria-label="Welcome" hidden>
  <div class="cv-bg"></div>
  <canvas id="dust" class="cv-dust" aria-hidden="true"></canvas>
  <div class="cv-in">
    <div class="cv-logo"><img src="assets/logo.png" alt="Victory Outreach Ministry International logo"></div>
    <p class="cv-eyebrow">Victory Outreach Ministry International</p>
    <h2 class="cv-title"><span>Created</span> <em>To Worship</em></h2>
    <div class="orn"><i></i></div>
    <section class="cv-verse" id="cvVerse" aria-live="off" title="Tap for the next verse"><div class="verse-kind"></div><blockquote></blockquote><cite></cite></section>
    <button id="enterBtn" class="btn solid cv-btn" type="button">Enter the Songbook</button>
  </div>
</section>

<dialog id="songDlg"><div id="songBody"></div></dialog>
<dialog id="setDlg"></dialog>
<dialog id="roleDlg"></dialog>
<dialog id="editDlg"></dialog>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
